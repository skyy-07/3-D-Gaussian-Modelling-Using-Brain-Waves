# Render Blueprint for the MnemoSplat monorepo.
#
# If this repository's root is the META folder (with mnemosplat/ inside it), keep this
# file. If you push mnemosplat/ as the repository root instead, delete this file and use
# mnemosplat/render.yaml.
#
# The image builds the web client, installs the Python package, and generates the
# offline focus/distracted assets at image-build time. No GPU or API key needed;
# recorded-EEG uploads write only temporary assets at runtime.

services:
  - type: web
    name: mnemosplat
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./mnemosplat/Dockerfile
    dockerContext: ./mnemosplat
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # Serve the baked demo. Paid generation endpoints return 403 unless
      # MNS_ADMIN_TOKEN is also set (then require X-MNS-Token). Recorded-EEG
      # uploads are public, CPU-only, and never call a model.
      - key: MNS_PUBLIC_DEMO
        value: "1"
      - key: MNS_LOG
        value: INFO
      - key: MNS_OUT
        value: /app/out/demo
      - key: MNS_WEB_DIST
        value: /app/web/dist
      # Lower this if free-plan uploads are too slow. The baked pair stays at 120k.
      - key: MNS_EEG_TARGET_SPLATS
        value: "60000"

      # Optional. Leave unset for the offline demo. Add both MODEL_API_KEY and
      # MNS_ADMIN_TOKEN only if you want authenticated on-demand generation.
      - key: MODEL_API_KEY
        sync: false
      - key: MNS_ADMIN_TOKEN
        sync: false

      # Experimental reconstruction branch. This free CPU service cannot run
      # BrainVis/SD1.5 itself. It proxies to the lightweight CPU mirror below.
      # That mirror is synthetic (not the authors' checkpoint); set
      # MNS_RECON_PROVIDER=worker and point at a CUDA worker for the real model.
      - key: MNS_BRAINVIS_WORKER_URL
        value: https://brainvis-api.onrender.com
      - key: MNS_RECON_PROVIDER
        value: mirror
        # For a labelled scripted running-shoe demo with no checkpoint, change the
        # value above to "fixture". It returns fixed illustration frames, not EEG
        # reconstruction; the UI and API mark the job as scripted_demo_fixture.
      - key: MNS_RECON_PUBLIC
        value: "1"
      - key: MNS_BRAINVIS_WORKER_TOKEN
        sync: false
      - key: MNS_RECON_MAX_FRAMES
        value: "4"
      - key: MNS_BRAINVIS_TIMEOUT_S
        value: "900"
