[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemosplat"
version = "0.1.0"
description = "MnemoSplat - EEG-salience conditioned 3D Gaussian memory volumes for WebXR"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MnemoSplat" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pillow>=10.3",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
depth = [
    "torch>=2.3",
    "transformers>=4.45",
]
gpu = [
    "torch>=2.3",
    "diffusers>=0.31",
    "accelerate>=0.33",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
mnemosplat = "mns.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
