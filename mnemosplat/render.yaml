# Render Blueprint when mnemosplat/ is the repository root.
#
# If you deploy from a monorepo whose root contains mnemosplat/, use the render.yaml in
# that parent folder instead (it sets dockerContext: ./mnemosplat).
#
# The image builds the web client, installs the Python package, and generates the
# offline focus/distracted assets at image-build time. No GPU or API key needed;
# recorded-EEG uploads write only temporary assets at runtime.

services:
  - type: web
    name: mnemosplat
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # Serve the baked demo. Paid generation endpoints return 403 unless
      # MNS_ADMIN_TOKEN is also set (then require X-MNS-Token). Recorded-EEG
      # uploads are public, CPU-only, and never call a model.
      - key: MNS_PUBLIC_DEMO
        value: "1"
      - key: MNS_LOG
        value: INFO
      - key: MNS_OUT
        value: /app/out/demo
      - key: MNS_WEB_DIST
        value: /app/web/dist
      # Lower this if free-plan uploads are too slow. The baked pair stays at 120k.
      - key: MNS_EEG_TARGET_SPLATS
        value: "60000"

      # Optional. Leave unset for the offline demo. Add both MODEL_API_KEY and
      # MNS_ADMIN_TOKEN only if you want authenticated on-demand generation.
      - key: MODEL_API_KEY
        sync: false
      - key: MNS_ADMIN_TOKEN
        sync: false

      # Optional experimental BrainVis branch. This free CPU service cannot run
      # BrainVis/SD1.5; these values must point at a separate CUDA worker. Leave
      # unset to keep the reconstruction route disabled.
      - key: MNS_BRAINVIS_WORKER_URL
        sync: false
      - key: MNS_BRAINVIS_WORKER_TOKEN
        sync: false
      - key: MNS_RECON_MAX_FRAMES
        value: "4"
